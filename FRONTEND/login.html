<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - PacienCare</title>
    <link rel="stylesheet" href="/css/styles.css?v=3">
</head>
<body>

    <!-- LADO IZQUIERDO: BANNER Y LOGOTIPO -->
    <div class="login-banner">
        <div class="logo-container">
            <img src="/images/paci.png" alt="Logotipo PacienCare">
        </div>
        <h1>Pacien<span>Care</span></h1>
        <p>Sistema Clínico Integral para Pacientes Crónicos.</p>
    </div>

    <!-- LADO DERECHO: FORMULARIO DE ACCESO -->
    <div class="login-form-container">
        <div class="form-header">
            <h2>Bienvenido de nuevo</h2>
            <p>Ingresa tus credenciales para acceder al panel.</p>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">Usuario</label>
                <div class="input-wrap">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" placeholder="Ej. admin" required autocomplete="username">
                </div>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <div class="input-wrap">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <div class="helper-row">
                <a href="#" class="link-text">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-submit" id="loginBtn">Iniciar Sesión</button>
            <div id="error-msg">Usuario o contraseña incorrectos.</div>
        </form>

        <div class="register-row">
            <span>¿No tienes cuenta?</span>
            <a href="#">Regístrate aquí</a>
        </div>
    </div>

    <script src="/js/login.js?v=20261006-1"></script>
</body>
</html>
