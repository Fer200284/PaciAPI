name: Deploy API to PacieAPI

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run API smoke tests
        working-directory: API
        run: python manage.py test config

      - name: Package API
        run: zip -r api-deploy.zip API requirements.txt -x "*/__pycache__/*" "*.pyc"

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_83D6214694CC4DF398CF84D58A678DA4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C452B3320F634F6E81AE9826FD803F27 }}
          allow-no-subscriptions: true

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: PacieAPI
          resource-group-name: PacienCareRG
          package: api-deploy.zip
          startup-command: gunicorn --chdir API config.wsgi:application --bind=0.0.0.0 --timeout 600
