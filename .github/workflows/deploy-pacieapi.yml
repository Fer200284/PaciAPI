name: Deploy API to PacieAPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run API smoke tests
        working-directory: API
        run: python manage.py test config

      - name: Package API
        run: zip -r api-deploy.zip API requirements.txt -x "*/__pycache__/*" "*.pyc"

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: PacieAPI
          package: api-deploy.zip
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          startup-command: gunicorn --chdir API config.wsgi:application --bind=0.0.0.0 --timeout 600
