name: Deploy PaciAPI to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run API smoke tests
        working-directory: API
        run: python manage.py test config

      - name: Package application
        run: |
          zip -r app-deploy.zip API FRONTEND requirements.txt -x "*/__pycache__/*" "*.pyc"

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: PaciAPI
          resource-group-name: rg-paciencare
          package: app-deploy.zip
          startup-command: gunicorn --chdir API config.wsgi:application --bind=0.0.0.0 --timeout 600