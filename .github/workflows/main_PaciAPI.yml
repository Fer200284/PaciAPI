name: Deploy PaciAPI to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run API smoke tests
        working-directory: API
        run: |
          python manage.py test config

      - name: Verify source code
        run: |
          echo "=========================================="
          echo " VERIFICANDO CODIGO DEL REPOSITORIO"
          echo "=========================================="

          echo "--- models.py ---"
          grep -n "ADMINISTRADOR" API/apps/Seguridad/Usuarios/models.py

          echo "--- urls.py ---"
          grep -n "WebTokenSerializer" API/apps/Seguridad/Usuarios/Api/urls.py
          grep -n "web/token" API/apps/Seguridad/Usuarios/Api/urls.py

      - name: Prepare deployment package
        run: |
          rm -rf deploy
          rm -f app-deploy.zip

          mkdir -p deploy

          cp -r API deploy/
          cp -r FRONTEND deploy/
          cp requirements.txt deploy/

          echo "=========================================="
          echo " ARCHIVOS PREPARADOS"
          echo "=========================================="

          find deploy/API/apps/Seguridad/Usuarios -maxdepth 2 -type f | sort

      - name: Verify deployment package
        run: |
          echo "=========================================="
          echo " VERIFICANDO PAQUETE DE DESPLIEGUE"
          echo "=========================================="

          echo "--- models.py dentro del paquete ---"
          grep -n "ADMINISTRADOR" \
            deploy/API/apps/Seguridad/Usuarios/models.py

          echo "--- WebTokenSerializer dentro del paquete ---"
          grep -n "WebTokenSerializer" \
            deploy/API/apps/Seguridad/Usuarios/Api/urls.py

          echo "--- web/token dentro del paquete ---"
          grep -n "web/token" \
            deploy/API/apps/Seguridad/Usuarios/Api/urls.py

      - name: Create deployment ZIP
        run: |
          cd deploy

          zip -r ../app-deploy.zip . \
            -x "*/__pycache__/*" \
            -x "*.pyc"

          cd ..

          echo "=========================================="
          echo " ZIP CREADO"
          echo "=========================================="

          ls -lh app-deploy.zip

      - name: Verify ZIP
        run: |
          echo "=========================================="
          echo " VERIFICANDO CONTENIDO DEL ZIP"
          echo "=========================================="

          echo "--- models.py dentro del ZIP ---"
          unzip -p app-deploy.zip \
            API/apps/Seguridad/Usuarios/models.py \
            | grep -n "ADMINISTRADOR"

          echo "--- WebTokenSerializer dentro del ZIP ---"
          unzip -p app-deploy.zip \
            API/apps/Seguridad/Usuarios/Api/urls.py \
            | grep -n "WebTokenSerializer"

          echo "--- web/token dentro del ZIP ---"
          unzip -p app-deploy.zip \
            API/apps/Seguridad/Usuarios/Api/urls.py \
            | grep -n "web/token"

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: PaciAPI
          resource-group-name: rg-paciencare
          package: app-deploy.zip
          clean: true
          startup-command: gunicorn --chdir API config.wsgi:application --bind=0.0.0.0 --timeout 600